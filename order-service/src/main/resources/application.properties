# ? Spring Boot ?
spring.application.name=order-service
server.port=5113
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

# ? Database ?
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_service_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:22572}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ? Hibernate ?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ? Dubbo ?
dubbo.application.name=order-service
dubbo.protocol.name=dubbo
dubbo.protocol.port=-1
dubbo.registry.address=zookeeper://${DOCKER_HOST:localhost}:2181
dubbo.application.qos-enable=true
dubbo.application.qos-port=22225

# Dubbo Serialization Security
dubbo.application.serialize-check-status=STRICT
dubbo.application.serialization.security.check=true
dubbo.application.serialization.security.allowlist=file:security/serialize.allowlist


management.tracing.enabled=true
management.tracing.exporter.otlp.enabled=true
management.tracing.exporter.otlp.endpoint=http://localhost:4317
management.tracing.exporter.otlp.protocol=grpc

management.tracing.sampling.probability=1.0
otel.resource.attributes=service.name=order-service
spring.zipkin.baseUrl=http://localhost:9411/
spring.zipkin.enabled=true

# C?u h�nh logging file
logging.file.name=logs/accessOrder_log.log
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
spring.profiles.active=order-service
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.logger.org.springframework.web.filter.CommonsRequestLoggingFilter.additivity=false
logging.logger.org.springframework.web.filter.CommonsRequestLoggingFilter.appender-ref=ACCESS_LOG

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.enabled=true
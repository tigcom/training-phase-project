# Gateway port
server.port=5110
spring.application.name=gateway-service
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
${user-service:localhost}
# Gateway routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://${DOCKER_HOST:localhost}:5119
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RemoveRequestHeader=Cookie

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://${DOCKER_HOST:localhost}:5114
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.routes[1].filters[0]=RemoveRequestHeader=Cookie

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://${DOCKER_HOST:localhost}:5113
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[2].filters[0]=RemoveRequestHeader=Cookie

# OAuth2 Client Registration (Keycloak)
spring.security.oauth2.client.registration.keycloak.client-id=springboot-app
spring.security.oauth2.client.registration.keycloak.client-secret=6nBx7XXCHUJBWrVtNTzpDKsahQAlWl9M
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=password
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${DOCKER_HOST:localhost}:8080/realms/microservice-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${DOCKER_HOST:localhost}:8080/realms/microservice-realm/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://${DOCKER_HOST:localhost}:8080/realms/microservice-realm



#http://localhost:8080/realms/microservice-realm/protocol/openid-connect/token

# Logging
logging.level.org.springframework.security.oauth2.resourceserver=DEBUG
logging.level.org.springframework.security.oauth2.jwt=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
logging.level.org.springframework.security.web.server=TRACE

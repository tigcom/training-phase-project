# ? Spring Boot ?
spring.application.name=product-service
server.port=5114
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
# ? Database ?
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_service_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:22572}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# ? Hibernate ?
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dubbo config
dubbo.application.name=product-service
dubbo.protocol.name=dubbo
dubbo.protocol.port=-1
dubbo.registry.address=zookeeper://${DOCKER_HOST:localhost}:2181
dubbo.application.qos-enable=true
dubbo.application.qos-port=22224

# Dubbo Serialization Security
dubbo.application.serialize-check-status=STRICT
dubbo.application.serialization.security.check=true
dubbo.application.serialization.security.allowlist=file:security/serialize.allowlist

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss


# Kafka broker
spring.kafka.bootstrap-servers=${DOCKER_HOST:localhost}:9092

spring.cache.type=redis
spring.data.redis.host=${DOCKER_HOST:localhost}
spring.data.redis.port=6379

spring.cloud.stream.kafka.binder.brokers=${DOCKER_HOST:localhost}:9092
spring.cloud.stream.bindings.userConsumer-in-0.destination=my-topic
spring.cloud.stream.bindings.userConsumer-in-0.group=my-group
spring.cloud.stream.bindings.userConsumer-in-0.content-type=application/json

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

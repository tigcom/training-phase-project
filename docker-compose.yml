  services:
    database-mysql:
      container_name: database-mysql
      image: mysql:8.0.40-debian
      ports:
        - "3305:3306"
      environment:
        - MYSQL_ROOT_PASSWORD=22572
      volumes:
        - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "database-mysql" ]
        interval: 7s
        timeout: 5s
        retries: 3
      networks:
        - microservice_networks

    user-service:
      container_name: user-service
      build:
        context: .
        dockerfile: ./user-service/Dockerfile
      ports:
        - "5119:5119"
      environment:
        - DB_URL=jdbc:mysql://database-mysql:3306/user_service_db
        - DOCKER_HOST=host.docker.internal
        - VAULT_TOKEN=vaulttoken
      depends_on:
        - database-mysql
      networks:
        - microservice_networks

    redis:
      image: redis:latest
      container_name: redis-container
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      networks:
        - microservice_networks
      restart: always

    vault:
      container_name: vault
      image: hashicorp/vault:latest
      ports:
        - "8200:8200"
      environment:
        VAULT_DEV_ROOT_TOKEN_ID: vaulttoken
        VAULT_TOKEN: vaulttoken
      volumes:
        - ./init-vault.sh:/init-vault.sh:rw
      cap_add:
        - IPC_LOCK
      command: >
        sh -c "vault server -dev -dev-listen-address=0.0.0.0:8200 &
               sleep 5 &&
               /init-vault.sh &&
               tail -f /dev/null"
      networks:
        - microservice_networks

    api-gateway:
      build:
        context: .
        dockerfile: ./gateway-api/Dockerfile
      container_name: api-gateway
      depends_on:
        keycloak:
          condition: service_healthy
        user-service:
          condition: service_started
        product-service:
          condition: service_started
        order-service:
          condition: service_started
      ports:
        - "5110:5110"
      environment:
        SERVICE_HOST: gateway-api
        DOCKER_HOST: host.docker.internal
      networks:
        - microservice_networks

    keycloak:
      image: quay.io/keycloak/keycloak:latest
      container_name: keycloak
      ports:
        - "8080:8080"
      command: start-dev --import-realm
      environment:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: 22572
      volumes:
        - keycloak_data:/opt/keycloak/data
        - e KC_FRONTEND_URL=http://localhost:8080
        - D:/microservice-demo/keycloak-configs:/opt/keycloak/data/import
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://127.0.0.1/health" ]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - microservice_networks

    zookeeper:
      image: zookeeper:3.8
      container_name: zookeeper
      restart: always
      ports:
        - "2181:2181"
      networks:
        - microservice_networks

    product-service:
      container_name: product-service
      build:
        context: .
        dockerfile: ./product-service/Dockerfile
      ports:
        - "5114:5114"
      environment:
        - DB_USERNAME=root
        - DB_PASSWORD=22572
        - DOCKER_HOST=host.docker.internal
        - DB_URL=jdbc:mysql://database-mysql:3306/product_service_db
      depends_on:
        - database-mysql
      networks:
        - microservice_networks
    kafka:
      image: bitnami/kafka:latest
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        - KAFKA_ENABLE_KRAFT=yes
        - KAFKA_CFG_NODE_ID=1
        - KAFKA_CFG_PROCESS_ROLES=broker,controller
        - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
        - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
        - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
        - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
        - KAFKA_CFG_LOG_DIRS=/tmp/kraft-combined-logs
        - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-1
      volumes:
        - kafka-data:/bitnami/kafka
      networks:
        - microservice_networks
    order-service:
      container_name: order-service
      build:
        context: .
        dockerfile: ./order-service/Dockerfile
      ports:
        - "5113:5113"
      environment:
        - DB_USERNAME=root
        - DB_PASSWORD=22572
        - DOCKER_HOST=host.docker.internal
        - DB_URL=jdbc:mysql://database-mysql:3306/order_service_db
      depends_on:
        - database-mysql
      networks:
        - microservice_networks

  networks:
    microservice_networks:
      driver: bridge

  volumes:
    keycloak_data:
      driver: local
    redis_data:
      driver: local
    kafka-data:
      driver: local
